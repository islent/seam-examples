# Seam manifest — authoring form.
# Generated by `seam derive`. Comments in a hand-edited file are load-bearing:
# they are where the reason for a `sealed` lives.

[seam]
version = "0.1"
profile = "L2"

[identity]
name = "meep-pulse-2d"
adapter = "meep"
domain = "photonics"
code = "Meep 1.33.0-beta"
entry = "python:/opt/conda/envs/mp/bin/python"
description = "2D point source in a PML box. The reference case for genuine per-step liveness."

[evidence]
sources = ["python:meep.Simulation.__init__ (signature, resolution/Courant/eps_averaging/dimensions)", "python:meep.Simulation.run (until)", "run:meep-extend-01 (until extended 60 -> 120 mid-run, run continued)", "run:meep-stop-01 (stop flag honoured at the next callback)"]

[cadence]
poll = "1s"

[[param]]
name = "resolution"
affordance = "dial"
liveness = "sealed"
grade = "imperative"
domain = {kind = "continuous", lo = 8, hi = 200, step = 2, dtype = "int"}
default = 24
unit = "px/a"
doc = "Grid resolution. The Yee grid is built from it, so it is fixed at construction."
provenance = {grade = "E1", witness = "python:meep.Simulation.__init__", evidence = "signature", assumed = true}

[[param]]
name = "Courant"
affordance = "dial"
liveness = "sealed"
grade = "imperative"
domain = {kind = "continuous", lo = 0.1, hi = 0.9, step = 0.05, dtype = "float"}
default = 0.5
doc = "Courant factor. Sets dt = Courant/resolution; changing it mid-run invalidates the integrator."
provenance = {grade = "E1", witness = "python:meep.Simulation.__init__(Courant)", evidence = "signature"}

[[param]]
name = "pml_thickness"
affordance = "dial"
liveness = "sealed"
grade = "imperative"
domain = {kind = "continuous", lo = 0.2, hi = 4.0, step = 0.2, dtype = "float"}
default = 1.0
unit = "a"
doc = "PML thickness in Meep length units. Part of the boundary layer list, built at construction."
provenance = {grade = "E1", witness = "python:meep.PML(thickness)", evidence = "source"}

[[param]]
name = "dimensions"
affordance = "ratchet"
liveness = "sealed"
grade = "imperative"
domain = {kind = "enum", values = [1, 2, 3]}
default = 2
doc = "Spatial rank. Changing it changes the whole geometry type, not just a number."
provenance = {grade = "E1", witness = "python:meep.Simulation.__init__(dimensions)", evidence = "signature"}

[[param]]
name = "eps_averaging"
affordance = "ratchet"
liveness = "sealed"
grade = "imperative"
domain = {kind = "enum", values = [true, false]}
default = true
doc = "Subpixel smoothing of the dielectric function. Construction-time."
provenance = {grade = "E1", witness = "python:meep.Simulation.__init__(eps_averaging)", evidence = "signature"}

[[param]]
name = "force_complex_fields"
affordance = "ratchet"
liveness = "sealed"
grade = "imperative"
domain = {kind = "enum", values = [false, true]}
default = false
doc = "Complex field arrays. Changes the dtype of every observation downstream."
provenance = {grade = "E1", witness = "python:meep.Simulation.__init__(force_complex_fields)", evidence = "signature"}

[[param]]
name = "until"
affordance = "dial"
liveness = "perstep"
grade = "imperative"
domain = {kind = "continuous", lo = 5, hi = 500, step = 5, dtype = "float"}
default = 60
unit = "a/c"
transition = "running -> running (extended)"
doc = "Run end time. Extending it mid-run is honoured: the callback breaks out and run() is re-entered."
provenance = {grade = "E4", witness = "run:meep-extend-01", evidence = "run"}

[[param]]
name = "stop"
affordance = "trigger"
liveness = "perstep"
grade = "imperative"
domain = {kind = "void"}
transition = "running -> stopped"
doc = "Stop the run at the next step callback. The fields remain readable afterwards."
provenance = {grade = "E4", witness = "run:meep-stop-01", evidence = "run"}

[[param]]
name = "dump_slice"
affordance = "trigger"
liveness = "perstep"
grade = "imperative"
domain = {kind = "void"}
doc = "Write the current Ez slice to HDF5. On-demand observation made explicit as an action."
provenance = {grade = "E4", witness = "run:meep-dump-01", evidence = "run"}

[[observe]]
name = "step"
shape = "scalar"
pitch = "per-step"
source = "stdout:SEAM"
doc = "Yee timestep index, derived from meep_time()/dt."
provenance = {grade = "E1", witness = "python:meep.Simulation.dt", evidence = "source"}

[[observe]]
name = "time"
unit = "a/c"
shape = "scalar"
pitch = "per-step"
source = "stdout:SEAM"
doc = "Meep time."
provenance = {grade = "E1", witness = "python:meep.Simulation.meep_time", evidence = "source"}

[[observe]]
name = "ez_max"
shape = "scalar"
pitch = "per-step"
source = "stdout:SEAM"
doc = "max|Ez| over the whole cell. An aggregate: cheap, always true, and not a substitute for the field."
provenance = {grade = "E1", witness = "python:meep.Simulation.get_array", evidence = "source"}

[[observe]]
name = "ez_rms"
shape = "series"
pitch = "per-step"
source = "stdout:SEAM"
doc = "RMS of Ez. The trace of this quantity is what shows the pulse leaving the cell."
provenance = {grade = "E1", witness = "python:meep.Simulation.get_array", evidence = "source"}

[[observe]]
name = "ez_slice"
shape = "grid"
pitch = "on-demand"
source = "file:slice.npy"
dimensions = ["x", "y"]
doc = "Ez on the full cell. On-demand on purpose: per-step would be 4e8 samples for a long run."
provenance = {grade = "E1", witness = "python:meep.Simulation.get_array", evidence = "source"}

[[artifact]]
name = "slice"
shape = "grid"
pitch = "on-demand"
path = "slice.npy"
doc = "Produced by the dump_slice trigger; its presence is a lifecycle fact."
provenance = {grade = "E1", witness = "python:meep.Simulation.get_array", evidence = "source"}

[[notes]]
name = "n_steps"
reason = "Meep has no step-count parameter; until and dt are the real parameters. A dial named n_steps would be E3 fiction."
witness = "python:meep.Simulation.__init__"
