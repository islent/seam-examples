# Seam manifest — authoring form.
# Generated by `seam derive`. Comments in a hand-edited file are load-bearing:
# they are where the reason for a `sealed` lives.

[seam]
version = "0.1"
profile = "L2"

[identity]
name = "ans-plummer"
adapter = "astronbodysim"
domain = "stellar-dynamics"
code = "AstroNbodySim.jl on Julia 1.13.3"
entry = "julia:/opt/astro/AstroNbodySim.jl"
description = "Plummer cluster under direct summation. The code already had a seam; the manifest only names it."

[evidence]
sources = ["julia:src/base/Config.jl:1001 struct Simulation{D} — immutable, so fields are sealed by the language", "julia:src/base/Config.jl:1053 Simulation(d; ...) kwargs — the parameter surface", "julia:src/run.jl:154 for ps in sim.poststep; ps(sim) — the per-step channel, at E1", "julia:src/base/Config.jl:814 TimeInfo{stepcount, system_time_float, scalefactor} — the observation ranks"]

[cadence]
poll = "2s"

[[param]]
name = "time_end"
affordance = "dial"
liveness = "sealed"
grade = "imperative"
domain = {kind = "continuous", lo = 0.001, hi = 20, step = 0.001, dtype = "float"}
default = 0.01
unit = "Gyr"
doc = "TimeEnd as a Unitful quantity. The struct is immutable, so this cannot change once constructed."
provenance = {grade = "E1", witness = "julia:Simulation(; TimeEnd)", evidence = "struct"}

[[param]]
name = "dt_step"
affordance = "dial"
liveness = "sealed"
grade = "imperative"
domain = {kind = "continuous", lo = 1e-06, hi = 0.001, log = true, dtype = "float"}
default = 1e-05
unit = "Gyr"
doc = "TimeStep. Note that 0.0 is not a small step here, it selects the adaptive integrator: a distinct mode, modelled as its own ratchet in the runtime."
provenance = {grade = "E1", witness = "julia:Simulation(; TimeStep)", evidence = "struct"}

[[param]]
name = "dt_snap"
affordance = "dial"
liveness = "sealed"
grade = "imperative"
domain = {kind = "continuous", lo = 1e-05, hi = 0.5, log = true, dtype = "float"}
default = 0.001
unit = "Gyr"
doc = "TimeBetweenSnapshots."
provenance = {grade = "E1", witness = "julia:Simulation(; TimeBetweenSnapshots)", evidence = "struct"}

[[param]]
name = "num_samples"
affordance = "dial"
liveness = "sealed"
grade = "imperative"
domain = {kind = "continuous", lo = 50, hi = 5000, step = 50, dtype = "int"}
default = 200
doc = "Particle count in the Plummer initial condition. Passed to AstroIC, not to Simulation — still sealed, for the same reason."
provenance = {grade = "E1", witness = "julia:PlummerStarCluster(; NumSamples)", evidence = "struct"}

[[param]]
name = "total_mass"
affordance = "dial"
liveness = "sealed"
grade = "imperative"
domain = {kind = "continuous", lo = 1000.0, hi = 100000000.0, log = true, dtype = "float"}
default = 100000.0
unit = "Msun"
doc = "Total cluster mass."
provenance = {grade = "E1", witness = "julia:PlummerStarCluster(; TotalMass)", evidence = "struct"}

[[param]]
name = "virial_radius"
affordance = "dial"
liveness = "sealed"
grade = "imperative"
domain = {kind = "continuous", lo = 0.001, hi = 1.0, step = 0.001, dtype = "float"}
default = 0.01
unit = "kpc"
doc = "Plummer scale radius."
provenance = {grade = "E1", witness = "julia:PlummerStarCluster(; VirialRadius)", evidence = "struct"}

[[param]]
name = "snapshot"
affordance = "trigger"
liveness = "perstep"
grade = "imperative"
domain = {kind = "void"}
doc = "Push an output request onto the post-step channel. Fires at the next step boundary, not immediately."
provenance = {grade = "E1", witness = "julia:src/run.jl:154 poststep", evidence = "callback"}

[[param]]
name = "stop"
affordance = "trigger"
liveness = "perstep"
grade = "imperative"
domain = {kind = "void"}
transition = "running -> stopped"
doc = "Raise out of the post-step callback. The run unwinds cleanly and the emitted summary says 'stopped', not 'finished'."
provenance = {grade = "E1", witness = "julia:src/run.jl:154 poststep", evidence = "callback"}

[[observe]]
name = "step"
shape = "scalar"
pitch = "per-step"
source = "stdout:SEAM"
doc = "timeinfo.stepcount, read in the post-step callback."
provenance = {grade = "E1", witness = "julia:TimeInfo.stepcount", evidence = "struct"}

[[observe]]
name = "time"
unit = "Gyr"
shape = "scalar"
pitch = "per-step"
source = "stdout:SEAM"
doc = "timeinfo.system_time_float, in simulation time units."
provenance = {grade = "E1", witness = "julia:TimeInfo.system_time_float", evidence = "struct"}

[[observe]]
name = "scale_factor"
shape = "series"
pitch = "per-step"
source = "stdout:SEAM"
doc = "timeinfo.scalefactor. Constant for a non-cosmological run, which is itself worth seeing."
provenance = {grade = "E1", witness = "julia:TimeInfo.scalefactor", evidence = "struct"}

[[artifact]]
name = "snapshot_dir"
shape = "table"
pitch = "per-step"
path = "output"
doc = "Snapshot directory. A directory rather than a file: the artifacts primitive accepts both, and this code writes one directory."
provenance = {grade = "E1", witness = "julia:Simulation(; OutputDir)", evidence = "struct"}
