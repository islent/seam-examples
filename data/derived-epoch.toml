# Seam manifest — authoring form.
# Generated by `seam derive`. Comments in a hand-edited file are load-bearing:
# they are where the reason for a `sealed` lives.

[seam]
version = "0.1"
profile = "L1"

[identity]
name = "epoch-probe"
code = "EPOCH3D"
entry = "unknown"
adapter = "epoch"

[evidence]
sources = ["deck:data/epoch_laser.deck"]

[cadence]
poll = "2s"

[[param]]
name = "control.nx"
affordance = "dial"
liveness = "sealed"
grade = "imperative"
adapter_key = "control.nx"
domain = {kind = "continuous", lo = 16.0, hi = 512.0, dtype = "int"}
default = 200.0
provenance = {grade = "E0", witness = "cli:--bound control.nx=16.0,512.0", evidence = "author"}

[[param]]
name = "control.t_end"
affordance = "dial"
liveness = "sealed"
grade = "imperative"
adapter_key = "control.t_end"
domain = {kind = "continuous", lo = 10.0, hi = 2000.0, dtype = "int"}
default = 50.0
unit = "fs"
doc = "Final time of simulation"
provenance = {grade = "E0", witness = "cli:--bound control.t_end=10.0,2000.0", evidence = "author"}

[[param]]
name = "control.x_min"
affordance = "unresolved"
