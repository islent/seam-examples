# Seam manifest — EPOCH3D (deck-driven CLI)
# Derivation: seam/mappings/epoch.md

[seam]
version = "0.1"
profile = "L1"

[identity]
name = "epoch-laser-3d"
adapter = "epoch"
domain = "plasma"
code = "EPOCH3D (unknown build hash)"
entry = "cli:/opt/epoch/epoch3d/bin/epoch3d"
description = "3D underdense plasma with an open box. Everything is sealed: the deck is read once."

[evidence]
sources = [
  "deck:begin:control / begin:boundaries / begin:species / begin:output (grammar harvest)",
  "cli:epoch3d prompts 'Specify output directory' then reads <dir>/input.deck (observed, not documented)",
  "run:epoch-baseline-01 (bounds in begin:boundaries are rejected; they must be in begin:control)",
  "run:epoch-baseline-02 (epoch3d.dat is appended live, one line per snapshot write)",
]

[cadence]
poll = "1s"

# ---------------------------------------------------------------------------
# Writes — the deck is parsed once, so every parameter is sealed by architecture.
# Bounds marked assumed=true are editorial: no evidence anywhere declares them.
# ---------------------------------------------------------------------------

[[param]]
name = "nx"
group = "grid"
precision = 0
affordance = "dial"
liveness = "sealed"
grade = "imperative"
domain = { kind = "continuous", lo = 16, hi = 512, step = 16, dtype = "int" }
default = 32
doc = "Cells in x. Domain is 8 micron wide, so dx = 8 micron / nx."
provenance = { grade = "E1", evidence = "deck-grammar", witness = "deck:begin:control:nx", assumed = true }

[[param]]
name = "ny"
group = "grid"
precision = 0
affordance = "dial"
liveness = "sealed"
grade = "imperative"
domain = { kind = "continuous", lo = 16, hi = 512, step = 16, dtype = "int" }
default = 32
doc = "Cells in y."
provenance = { grade = "E1", evidence = "deck-grammar", witness = "deck:begin:control:ny", assumed = true }

[[param]]
name = "nz"
group = "grid"
precision = 0
affordance = "dial"
liveness = "sealed"
grade = "imperative"
domain = { kind = "continuous", lo = 16, hi = 512, step = 16, dtype = "int" }
default = 48
doc = "Cells in z. The laser propagates along z, so this is the long axis."
provenance = { grade = "E1", evidence = "deck-grammar", witness = "deck:begin:control:nz", assumed = true }

[[param]]
name = "t_end"
group = "domain"
precision = 0
affordance = "dial"
liveness = "sealed"
grade = "imperative"
domain = { kind = "continuous", lo = 10, hi = 2000, step = 10, dtype = "float" }
default = 400
unit = "fs"
doc = "End time. Declared in femtoseconds; the deck carries the unit as arithmetic (t_end = 400 * femto)."
provenance = { grade = "E1", evidence = "deck-grammar", witness = "deck:begin:control:t_end" }

[[param]]
name = "bc_x_min"
group = "domain"
affordance = "ratchet"
liveness = "sealed"
grade = "imperative"
domain = { kind = "enum", values = ["open", "reflect", "periodic", "simple_laser"] }
default = "open"
doc = "Boundary at x_min. simple_laser only means anything with a matching begin:laser block."
provenance = { grade = "E2", evidence = "docstring", witness = "deck:begin:boundaries:bc_x_min" }

[[param]]
name = "bc_x_max"
group = "domain"
affordance = "ratchet"
liveness = "sealed"
grade = "imperative"
domain = { kind = "enum", values = ["open", "reflect", "periodic", "simple_laser"] }
default = "open"
doc = "Boundary at x_max."
provenance = { grade = "E2", evidence = "docstring", witness = "deck:begin:boundaries:bc_x_max" }

[[param]]
name = "dt_snapshot"
group = "output"
precision = 0
affordance = "dial"
liveness = "sealed"
grade = "imperative"
domain = { kind = "continuous", lo = 5, hi = 200, step = 5, dtype = "float" }
default = 40
unit = "fs"
doc = "Snapshot interval. Also the effective observation pitch: the step table only grows when a snapshot lands."
provenance = { grade = "E1", evidence = "deck-grammar", witness = "deck:begin:output:dt_snapshot" }

[[param]]
name = "stop"
group = "run control"
affordance = "trigger"
liveness = "midrun"
grade = "imperative"
domain = { kind = "void" }
confirm = true
transition = "running -> terminated"
doc = "SIGTERM. The only mid-run channel this code has; it terminates rather than steers."
provenance = { grade = "E4", evidence = "signal-probe", witness = "run:epoch-stop-01" }

# ---------------------------------------------------------------------------
# Reads — all from epoch3d.dat, which EPOCH appends as each snapshot is written.
# ---------------------------------------------------------------------------

[[observe]]
name = "iteration"
group = "progress"
precision = 0
shape = "scalar"
pitch = "per-step"
source = "file:epoch3d.dat"
doc = "Integration iteration, parsed from 'Wrote normal , NNNN.sdf at time T and iteration I'."
provenance = { grade = "E4", evidence = "run", witness = "run:epoch-baseline-02" }

[[observe]]
name = "time"
group = "progress"
precision = 2
shape = "scalar"
pitch = "per-step"
unit = "s"
source = "file:epoch3d.dat"
doc = "Simulation time at the last snapshot write."
provenance = { grade = "E4", evidence = "run", witness = "run:epoch-baseline-02" }

[[observe]]
name = "snapshot_index"
group = "progress"
precision = 0
shape = "series"
pitch = "per-step"
source = "file:epoch3d.dat"
doc = "Monotonic snapshot counter. The only progress signal this build emits without a reader for SDF."
provenance = { grade = "E4", evidence = "run", witness = "run:epoch-baseline-02" }

[[artifact]]
name = "sdf_snapshot"
path = "0001.sdf"
shape = "grid"
pitch = "per-step"
doc = "SDF dump per dt_snapshot. Reading it needs an SDF reader, which v0.1 deliberately does not require."
provenance = { grade = "E1", evidence = "source", witness = "deck:begin:output:ey" }

[[notes]]
name = "pitch_per_event"
reason = "epoch3d.dat grows per snapshot write, which is neither per-step nor per-second. Declared per-step with this note rather than hidden. Candidate for a per-event:<name> pitch in v0.2 (SPEC 11)."
witness = "run:epoch-baseline-02"
