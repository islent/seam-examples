# Seam manifest — post-processing as its own seam.
#
# This is the answer to "where does post-processing live". It is a run: same primitives, same
# seal, same trace, same specimen. The only difference is that it reads another run's output
# instead of integrating anything.
#
#   seam run manifests/postproc-gadget.toml --host user@hpc-node \
#       --input '$HOME/seam-runs/g2-demo03'

[seam]
version = "0.1"
profile = "L1"

[identity]
name = "postproc-energy-budget"
adapter = "postproc"
analysis = "energy_budget"
domain = "cosmology"
code = "seam postproc (python, read-only)"
entry = "python:postproc.py"
description = "Energy budget and virial ratio over a finished Gadget-2 run. Declared, traced, replayable."

[evidence]
sources = [
  "file:output/energy.txt columns Time a Epot Ekin (established by observation, E4)",
  "run:postproc-g2-01 (17 rows, virial ratio settles near 2 for an equilibrium Plummer sphere)",
]

[cadence]
poll = "1s"

# ---------------------------------------------------------------------------
# Writes — all sealed. An analysis reads its inputs once, exactly like a deck.
# ---------------------------------------------------------------------------

[[param]]
name = "skip_rows"
group = "analysis"
precision = 0
affordance = "dial"
liveness = "sealed"
grade = "imperative"
domain = { kind = "continuous", lo = 0, hi = 20, step = 1, dtype = "int" }
default = 1
doc = "Rows to drop from the head. Row 0 is the initial condition; including it in a drift baseline is fine, including it in a virial average is not."
provenance = { grade = "E1", evidence = "source", witness = "python:postproc.py rows[skip:]" }

[[param]]
name = "window"
group = "analysis"
precision = 0
affordance = "dial"
liveness = "sealed"
grade = "imperative"
domain = { kind = "continuous", lo = 1, hi = 20, step = 1, dtype = "int" }
default = 3
doc = "Moving-average width for the smoothed drift. Width 1 is the raw series."
provenance = { grade = "E1", evidence = "source", witness = "python:postproc.py window" }

[[param]]
name = "tolerance"
group = "analysis"
precision = 3
affordance = "dial"
liveness = "sealed"
grade = "imperative"
domain = { kind = "continuous", lo = 0.001, hi = 0.5, step = 0.001, dtype = "float" }
default = 0.05
doc = "Acceptable fractional energy drift. Sets the `within_tolerance` verdict, so the analysis has an opinion rather than just numbers."
provenance = { grade = "E0", evidence = "author", witness = "manifests/postproc-gadget.toml" }

[[param]]
name = "pace"
group = "analysis"
precision = 2
affordance = "dial"
liveness = "sealed"
grade = "advisory"
domain = { kind = "continuous", lo = 0.0, hi = 1.0, step = 0.05, dtype = "float" }
default = 0.25
doc = "Seconds between emitted rows. Present only so a live surface can watch the analysis advance; set 0 for batch use."
provenance = { grade = "E0", evidence = "author", witness = "manifests/postproc-gadget.toml" }

# ---------------------------------------------------------------------------
# Reads
# ---------------------------------------------------------------------------

[[observe]]
name = "time"
group = "input"
precision = 4
shape = "scalar"
pitch = "per-step"
unit = "code"
source = "stdout:SEAM"
doc = "Row time from energy.txt."
provenance = { grade = "E4", evidence = "run", witness = "run:postproc-g2-01" }

[[observe]]
name = "energy_pot"
group = "input"
precision = 5
shape = "series"
pitch = "per-step"
unit = "code"
source = "stdout:SEAM"
doc = "Potential energy per row."
provenance = { grade = "E4", evidence = "run", witness = "run:postproc-g2-01" }

[[observe]]
name = "energy_kin"
group = "input"
precision = 5
shape = "series"
pitch = "per-step"
unit = "code"
source = "stdout:SEAM"
doc = "Kinetic energy per row."
provenance = { grade = "E4", evidence = "run", witness = "run:postproc-g2-01" }

[[observe]]
name = "virial_ratio"
group = "energetics"
precision = 3
shape = "series"
pitch = "per-step"
source = "stdout:SEAM"
doc = "|2K/W|. Near 2 for a virialised system; the trace of it is the cheapest equilibrium check there is."
provenance = { grade = "E4", evidence = "run", witness = "run:postproc-g2-01" }

[[observe]]
name = "energy_drift"
group = "energetics"
precision = 3
shape = "series"
pitch = "per-step"
source = "stdout:SEAM"
doc = "|E(t) - E(0)| / |E(0)|, raw."
provenance = { grade = "E4", evidence = "run", witness = "run:postproc-g2-01" }

[[observe]]
name = "drift_smoothed"
group = "energetics"
precision = 3
shape = "series"
pitch = "per-step"
source = "stdout:SEAM"
doc = "Moving average of the drift over `window` rows."
provenance = { grade = "E4", evidence = "run", witness = "run:postproc-g2-01" }

[[observe]]
name = "drift_final"
group = "energetics"
precision = 3
shape = "scalar"
pitch = "per-step"
source = "stdout:SEAM"
doc = "Final drift. The number that goes in a table."
provenance = { grade = "E4", evidence = "run", witness = "run:postproc-g2-01" }

[[observe]]
name = "within_tolerance"
group = "verdict"
precision = 1
shape = "scalar"
pitch = "per-step"
source = "stdout:SEAM"
doc = "1.0 if drift_final <= tolerance, else 0.0. A verdict, not a number — so a surface can turn it red."
provenance = { grade = "E0", evidence = "author", witness = "manifests/postproc-gadget.toml" }
