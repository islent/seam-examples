# Seam manifest — Gadget-2.0.7 (tag-value paramfile CLI)
# Derivation: seam/mappings/gadget2.md

[seam]
version = "0.1"
profile = "L1"

[identity]
name = "gadget2-plummer"
adapter = "gadget2"
domain = "cosmology"
code = "Gadget-2.0.7 (Gadget2_tree_double)"
entry = "cli:/opt/gadget2/bin/Gadget2_tree_double"
description = "20k-particle Plummer sphere, non-comoving, non-periodic. The paramfile unit trap case."

[evidence]
sources = [
  "c:param.c sscanf(\"%s%s%s\") — the grammar, which the paramfile itself does not reveal",
  "c:read_parameter_file strcmp chain — tag list and per-tag dtype (atoi/atof/strcpy)",
  "file:param_test.txt unit block — UnitTime = UnitLength/UnitVelocity = 0.9778 Gyr",
  "run:g2-baseline-01 (energy.txt columns observed: Time a Epot Ekin ...)",
]

[cadence]
poll = "1s"

# ---------------------------------------------------------------------------
# Writes
# ---------------------------------------------------------------------------

[[param]]
name = "TimeMax"
group = "units & time"
precision = 3
affordance = "dial"
liveness = "sealed"
grade = "imperative"
domain = { kind = "continuous", lo = 0.01, hi = 20, step = 0.01, dtype = "float" }
default = 0.02
unit = "Gyr"
display_scale = 0.9778
doc = "End time. Displayed in Gyr, written in code time. The unit time here is 0.9778 Gyr, not 1 Gyr: a 2.2% error that survives review and invalidates comparisons."
provenance = { grade = "E1", evidence = "paramfile-grammar", witness = "c:read_parameter_file(TimeMax)" }

[[param]]
name = "TimeBetSnapshot"
group = "units & time"
precision = 3
affordance = "dial"
liveness = "sealed"
grade = "imperative"
domain = { kind = "continuous", lo = 0.001, hi = 1, step = 0.001, dtype = "float" }
default = 0.01
unit = "Gyr"
display_scale = 0.9778
doc = "Snapshot interval, same unit trap as TimeMax."
provenance = { grade = "E1", evidence = "paramfile-grammar", witness = "c:read_parameter_file(TimeBetSnapshot)" }

[[param]]
name = "BoxSize"
group = "physics"
precision = 0
affordance = "dial"
liveness = "sealed"
grade = "imperative"
domain = { kind = "continuous", lo = 10, hi = 1000, step = 10, dtype = "float" }
default = 300
unit = "kpc"
doc = "Box edge. Must contain the initial condition, which is 20 kpc across here."
provenance = { grade = "E1", evidence = "paramfile-grammar", witness = "c:read_parameter_file(BoxSize)" }

[[param]]
name = "SofteningHalo"
group = "physics"
precision = 3
affordance = "dial"
liveness = "sealed"
grade = "imperative"
domain = { kind = "continuous", lo = 0.01, hi = 5, step = 0.01, dtype = "float" }
default = 0.05
unit = "kpc"
doc = "Plummer softening. Non-comoving, so this is the physical length and is not scaled by a."
provenance = { grade = "E1", evidence = "paramfile-grammar", witness = "c:read_parameter_file(SofteningHalo)" }

[[param]]
name = "ErrTolTheta"
group = "physics"
precision = 2
affordance = "dial"
liveness = "sealed"
grade = "imperative"
domain = { kind = "continuous", lo = 0.1, hi = 1.0, step = 0.05, dtype = "float" }
default = 0.5
doc = "Tree opening angle. Larger is faster and less accurate."
provenance = { grade = "E1", evidence = "paramfile-grammar", witness = "c:read_parameter_file(ErrTolTheta)" }

[[param]]
name = "ErrTolForceAcc"
group = "accuracy"
precision = 4
affordance = "dial"
liveness = "sealed"
grade = "imperative"
domain = { kind = "continuous", lo = 0.0005, hi = 0.05, step = 0.0005, dtype = "float" }
default = 0.005
doc = "Relative force accuracy. Sits next to SofteningHalo, which is a length: same keyword block, different physical meaning."
provenance = { grade = "E1", evidence = "paramfile-grammar", witness = "c:read_parameter_file(ErrTolForceAcc)" }

[[param]]
name = "Omega0"
group = "physics"
precision = 3
affordance = "dial"
liveness = "sealed"
grade = "imperative"
domain = { kind = "continuous", lo = 0.05, hi = 1.0, step = 0.05, dtype = "float" }
default = 0.3
doc = "Matter density. Ignored with ComovingIntegrationOn = 0, which is the case here — declared anyway so the surface is complete."
provenance = { grade = "E1", evidence = "paramfile-grammar", witness = "c:read_parameter_file(Omega0)" }

[[param]]
name = "stop"
group = "run control"
affordance = "trigger"
liveness = "midrun"
grade = "imperative"
domain = { kind = "void" }
confirm = true
transition = "running -> terminated"
doc = "SIGTERM. Writes a restart file on the way out. Expect a harmless 'mv: cannot stat output/restart.N' afterwards."
provenance = { grade = "E4", evidence = "signal-probe", witness = "run:g2-stop-01" }

# ---------------------------------------------------------------------------
# Reads — energy.txt, written every TimeBetStatistics.
# ---------------------------------------------------------------------------

[[observe]]
name = "time"
group = "energetics"
precision = 4
shape = "scalar"
pitch = "per-step"
unit = "code"
source = "file:output/energy.txt"
doc = "Column 1. Code time; multiply by 0.9778 for Gyr."
provenance = { grade = "E4", evidence = "run", witness = "run:g2-baseline-01" }

[[observe]]
name = "scale_factor"
group = "energetics"
precision = 2
shape = "scalar"
pitch = "per-step"
source = "file:output/energy.txt"
doc = "Column 2. Zero throughout with ComovingIntegrationOn = 0."
provenance = { grade = "E4", evidence = "run", witness = "run:g2-baseline-01" }

[[observe]]
name = "energy_pot"
group = "energetics"
precision = 5
shape = "series"
pitch = "per-step"
unit = "code"
source = "file:output/energy.txt"
doc = "Column 3. Identically zero if the build lacks -DOUTPUTPOTENTIAL: the column is silently 0, not an error."
provenance = { grade = "E4", evidence = "run", witness = "run:g2-baseline-01" }

[[observe]]
name = "energy_kin"
group = "energetics"
precision = 5
shape = "series"
pitch = "per-step"
unit = "code"
source = "file:output/energy.txt"
doc = "Column 4. Identical between the single- and double-precision builds, which is the useful cross-check."
provenance = { grade = "E4", evidence = "run", witness = "run:g2-baseline-01" }

[[artifact]]
name = "snapshot"
path = "output/snapshot_000"
shape = "grid"
pitch = "per-step"
doc = "Snapshot series, NumFilesPerSnapshot = 1 so each index is one file."
provenance = { grade = "E1", evidence = "paramfile-grammar", witness = "c:read_parameter_file(SnapshotFileBase)" }

[[notes]]
name = "OutputListFilename"
reason = "A filesystem path. No finite domain, so no affordance: a text box over a path is not something an agent can validate."
witness = "c:read_parameter_file(OutputListFilename)"

[[notes]]
name = "ComovingIntegrationOn"
reason = "Changes what TimeMax means (expansion factor vs physical time). v0.1 has no first-class way to declare parameter interaction; recorded here instead."
witness = "param_test.txt:ComovingIntegrationOn"
